<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💰 From Box to Billionaire</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Fredoka',sans-serif}
html,body{height:100%;overflow:hidden;user-select:none;background:#000}
#app{height:100vh;position:relative;overflow:hidden}

#bg{position:absolute;inset:0;transition:all .6s ease;background-size:cover;background-position:center;z-index:0}
.s1{background-image:url('scene1.png')}
.s2{background-image:url('scene2.png')}
.s3{background-image:url('scene3.png')}
.s4{background-image:url('scene4.png')}
.s5{background-image:url('scene5.png')}
.s6{background-image:url('scene6.png')}
.s7{background-image:url('scene7.png')}

#char{position:absolute;bottom:52%;left:50%;transform:translateX(-50%);font-size:150px;z-index:3;
  filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));transition:font-size .4s;line-height:1;pointer-events:none}

.top{position:absolute;top:0;left:0;right:0;z-index:10;padding:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.bal-card{background:linear-gradient(180deg,#fffbe6,#ffe9a8);
  border:4px solid #8a5f1a;border-radius:22px;padding:10px 14px;text-align:center;
  box-shadow:0 6px 0 #8a5f1a,0 10px 20px rgba(0,0,0,.3)}
.bal-label{font-size:11px;color:#8a5f1a;font-weight:600;text-transform:uppercase;letter-spacing:1.5px}
.bal{font-size:34px;font-weight:700;color:#5a3a1a;line-height:1.1;text-shadow:0 2px 0 #fff}
.scene-name{font-size:13px;color:#6a4a1a;font-weight:600;margin-top:2px}
.prog-wrap{margin-top:8px;height:10px;background:#d4a860;border:2px solid #8a5f1a;border-radius:6px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,#4adf4a,#22b822);border-radius:4px;transition:width .4s;width:0}
.prog-txt{font-size:10px;color:#6a4a1a;margin-top:4px;font-weight:600}

.stats{display:flex;gap:8px}
.stat{flex:1;background:linear-gradient(180deg,#a8dcff,#5fb8ff);
  border:3px solid #2a6a9a;border-radius:14px;padding:6px;text-align:center;box-shadow:0 4px 0 #2a6a9a}
.stat-v{font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 0 #2a6a9a}
.stat-l{font-size:9px;color:#fff;text-transform:uppercase;font-weight:600;text-shadow:0 1px 0 #2a6a9a}

.tap-zone{position:absolute;inset:0;z-index:5;cursor:pointer}

.float{position:absolute;font-size:26px;font-weight:700;color:#fff;
  text-shadow:0 0 8px #ffd700,0 3px 0 #b8860b,0 0 20px #ffd700;
  pointer-events:none;animation:fup 1s ease-out forwards;z-index:20;transform:translate(-50%,-50%)}
@keyframes fup{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}30%{transform:translate(-50%,-80%) scale(1.2)}100%{transform:translate(-50%,-180%) scale(1);opacity:0}}

.tap-ring{position:absolute;width:80px;height:80px;border:3px solid #ffd700;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;animation:ring .6s ease-out forwards;z-index:15}
@keyframes ring{0%{width:20px;height:20px;opacity:1}100%{width:120px;height:120px;opacity:0}}

/* === КОНТЕНТ (над вкладками, СВОРАЧИВАЕТСЯ свайпом вниз) === */
.content{
  position:absolute;left:0;right:0;
  bottom:80px;
  height:44vh;
  z-index:14;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#8a5f1a 0%,#6a4a1a 100%);
  border-top:5px solid #4a2f0a;border-radius:24px 24px 0 0;
  box-shadow:0 -6px 20px rgba(0,0,0,.5);
  transform:translateY(0);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
.content.collapsed{transform:translateY(calc(100% - 30px))}

.shop-handle-area{
  padding:14px 0 10px;
  display:flex;justify-content:center;align-items:center;
  cursor:grab;flex-shrink:0;
  touch-action:none;-webkit-user-select:none;user-select:none;
  position:relative;
}
.shop-handle{width:60px;height:7px;background:#d4a860;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:opacity .3s}
.shop-handle-area::before{
  content:'▲';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:16px;color:#d4a860;opacity:0;transition:opacity .3s;
}
.content.collapsed .shop-handle-area::before{opacity:1}
.content.collapsed .shop-handle{opacity:0}

.tab-content{overflow-y:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;flex:1;touch-action:pan-y}
.tab-content::-webkit-scrollbar{width:0}
.tab-content.hidden{display:none}

.card{background:linear-gradient(180deg,#fffbe6,#ffe9a8);
  border:3px solid #5a3a1a;border-radius:16px;padding:10px 12px;
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:transform .1s;
  box-shadow:0 4px 0 #5a3a1a;flex-shrink:0}
.card:not(.dis):active{transform:translateY(3px);box-shadow:0 1px 0 #5a3a1a}
.card.dis{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}

.card.biz{background:linear-gradient(180deg,#e6ffdc,#b8f0a8);border-color:#2a6a1a;box-shadow:0 4px 0 #2a6a1a}
.card.biz:not(.dis):active{box-shadow:0 1px 0 #2a6a1a}
.card.biz .cpv{color:#1a5a0a}

.ci{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.6);border-radius:12px;flex-shrink:0;border:2px solid rgba(90,58,26,.3)}
.cinfo{flex:1;min-width:0}
.cname{font-size:14px;font-weight:700;color:#3a2a0a}
.cdesc{font-size:11px;color:#6a4a1a;font-weight:500;margin-top:1px}
.lvl{display:inline-block;background:#ffd700;color:#5a3a1a;font-size:10px;font-weight:700;
  padding:1px 8px;border-radius:8px;margin-left:6px;border:2px solid #8a5f1a}
.cprice{text-align:right;flex-shrink:0}
.cpv{font-size:14px;font-weight:700;color:#8a5f1a;text-shadow:0 1px 0 #fff}
.cpl{font-size:9px;color:#6a4a1a;font-weight:600;text-transform:uppercase}

.soon{text-align:center;padding:30px 20px;color:#ffe9a8}
.soon .big{font-size:60px;margin-bottom:10px}
.soon .title{font-size:20px;font-weight:700;color:#ffd966;margin-bottom:6px}
.soon .sub{font-size:13px;color:#d4a860;line-height:1.5}

.tabs{
  position:absolute;bottom:0;left:0;right:0;z-index:20;
  display:flex;gap:6px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#7a4f10 0%,#5a3a0a 100%);
  border-top:4px solid #4a2f0a;
  box-shadow:0 -4px 12px rgba(0,0,0,.4);
}
.tab{flex:1;padding:8px 6px;border-radius:14px;text-align:center;cursor:pointer;
  background:rgba(0,0,0,.3);border:3px solid #4a2f0a;
  color:#d4a860;font-weight:700;font-size:11px;transition:all .15s;
  box-shadow:0 3px 0 #4a2f0a;user-select:none}
.tab:active{transform:translateY(2px);box-shadow:0 1px 0 #4a2f0a}
.tab.active{background:linear-gradient(180deg,#ffd966,#ffb800);color:#5a3a1a;border-color:#8a5f1a;
  box-shadow:0 3px 0 #8a5f1a;transform:translateY(-2px)}
.tab .tab-icon{font-size:22px;display:block;line-height:1;margin-bottom:2px}

.toast{position:fixed;bottom:calc(44vh + 100px);left:50%;transform:translateX(-50%) translateY(120px);
  background:linear-gradient(180deg,#fffbe6,#ffe9a8);color:#3a2a0a;
  padding:10px 20px;border-radius:14px;font-size:14px;font-weight:600;
  transition:transform .3s;z-index:100;border:3px solid #8a5f1a;
  box-shadow:0 4px 0 #8a5f1a;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}

.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:200;transition:opacity .35s}
.flash.on{opacity:.85}
</style>
</head>
<body>
<div id="app">
  <div id="bg" class="s1"></div>
  <div id="char">🧍</div>
  <div class="tap-zone" id="tapZone"></div>

  <div class="top">
    <div class="bal-card">
      <div class="bal-label">Баланс</div>
      <div class="bal">💰 <span id="money">0</span></div>
      <div class="scene-name" id="sn">🌧️ Бомж с коробкой</div>
      <div class="prog-wrap"><div class="prog-bar" id="pb"></div></div>
      <div class="prog-txt" id="pt">До след. уровня: 1.0K</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-v" id="ptap">1</div><div class="stat-l">За тап</div></div>
      <div class="stat"><div class="stat-v" id="psec">0</div><div class="stat-l">В сек</div></div>
    </div>
  </div>

  <!-- Контент (сворачивается свайпом вниз) -->
  <div class="content" id="content">
    <div class="shop-handle-area" id="handleArea">
      <div class="shop-handle"></div>
    </div>
    <div class="tab-content" id="tab-tap"></div>
    <div class="tab-content hidden" id="tab-biz"></div>
    <div class="tab-content hidden" id="tab-casino">
      <div class="soon">
        <div class="big">🎰</div>
        <div class="title">Казино скоро откроется!</div>
        <div class="sub">Рулетка, кости, слоты<br>и другие азартные игры</div>
      </div>
    </div>
  </div>

  <!-- Вкладки внизу -->
  <div class="tabs">
    <div class="tab active" data-tab="tap"><span class="tab-icon">👆</span>Тап</div>
    <div class="tab" data-tab="biz"><span class="tab-icon">🏢</span>Бизнес</div>
    <div class="tab" data-tab="casino"><span class="tab-icon">🎰</span>Казино</div>
  </div>
</div>

<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();tg?.setHeaderColor?.('#6a4a1a');
const SC=[
 {min:0,    cls:'s1',char:'🧍',    name:'🌧️ Бомж с коробкой'},
 {min:1e3,  cls:'s2',char:'🧑‍🔧',name:'🏚️ Работяга'},
 {min:1e5,  cls:'s3',char:'🧑‍💼',name:'🏠 Средний класс'},
 {min:1e6,  cls:'s4',char:'👨‍💼',name:'🏢 Бизнесмен'},
 {min:1e7,  cls:'s5',char:'🕴️',name:'🏡 Богач'},
 {min:1e9,  cls:'s6',char:'🤵',   name:'💎 Магнат'},
 {min:1e11, cls:'s7',char:'👑',   name:'🚀 Миллиардер'}
];
const DEF={money:0,perTap:1,tapLevel:0,tapCost:10,currentScene:0,businesses:[
 {id:'coffee',name:'Кофейня',icon:'☕',level:0,baseIncome:1,baseCost:50,income:1,cost:50},
 {id:'shop',name:'Магазин',icon:'🏪',level:0,baseIncome:8,baseCost:500,income:8,cost:500},
 {id:'factory',name:'Завод',icon:'🏭',level:0,baseIncome:50,baseCost:5000,income:50,cost:5000},
 {id:'bank',name:'Банк',icon:'🏦',level:0,baseIncome:300,baseCost:50000,income:300,cost:50000},
 {id:'corp',name:'Корпорация',icon:'🏢',level:0,baseIncome:2000,baseCost:500000,income:2000,cost:500000}
],lastTime:Date.now()};
let S=JSON.parse(localStorage.getItem('tapGame')||'null')||JSON.parse(JSON.stringify(DEF));
const now=Date.now();
const offSec=Math.min((now-(S.lastTime||now))/1000,3*3600);
const offEarn=getPS()*offSec;
S.money+=offEarn;S.lastTime=now;
const $=id=>document.getElementById(id);
function fmt(n){
 if(n<1000)return Math.floor(n).toString();
 if(n<1e6)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';
 if(n<1e9)return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
 if(n<1e12)return (n/1e9).toFixed(2).replace(/\.?0+$/,'')+'B';
 return (n/1e12).toFixed(2)+'T';
}
function getPS(){return S.businesses.reduce((s,b)=>s+b.level*b.baseIncome,0)}
function sceneIdx(){let i=0;for(let k=0;k<SC.length;k++)if(S.money>=SC[k].min)i=k;return i}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200)}

function renderScene(){
 const i=sceneIdx(),sc=SC[i];
 if(i!==S.currentScene){
  const f=$('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),80);
  S.currentScene=i;tg?.HapticFeedback?.notificationOccurred('success');
  toast('🎉 Новый уровень: '+sc.name);
 }
 $('bg').className=sc.cls;
 $('char').textContent=sc.char;
 $('sn').textContent=sc.name;
 const nx=SC[i+1];
 if(nx){const p=Math.min(100,((S.money-sc.min)/(nx.min-sc.min))*100);
  $('pb').style.width=p+'%';
  $('pt').textContent='До "'+nx.name+'": '+fmt(nx.min-S.money)}
 else{$('pb').style.width='100%';$('pt').textContent='🏆 Максимальный уровень!'}
}

function renderTap(){
 const el=$('tab-tap');el.innerHTML='';
 const t=document.createElement('div');
 t.className='card'+(S.money<S.tapCost?' dis':'');
 t.innerHTML=`<div class="ci">👆</div><div class="cinfo"><div class="cname">Сила тапа <span class="lvl">Ур. ${S.tapLevel}</span></div><div class="cdesc">+1 к тапу</div></div><div class="cprice"><div class="cpv">💰 ${fmt(S.tapCost)}</div><div class="cpl">Цена</div></div>`;
 t.onclick=e=>{e.stopPropagation();buyTap()};el.appendChild(t);
 const soon=document.createElement('div');
 soon.className='card dis';
 soon.innerHTML=`<div class="ci">🔒</div><div class="cinfo"><div class="cname">Больше апгрейдов</div><div class="cdesc">Откроются позже</div></div>`;
 el.appendChild(soon);
}

function renderBiz(){
 const el=$('tab-biz');el.innerHTML='';
 S.businesses.forEach(b=>{
  const c=document.createElement('div');
  c.className='card biz'+(S.money<b.cost?' dis':'');
  c.innerHTML=`<div class="ci">${b.icon}</div><div class="cinfo"><div class="cname">${b.name} <span class="lvl">Ур. ${b.level}</span></div><div class="cdesc">+${fmt(b.income)}/сек</div></div><div class="cprice"><div class="cpv">💰 ${fmt(b.cost)}</div><div class="cpl">Цена</div></div>`;
  c.onclick=e=>{e.stopPropagation();buyBiz(b.id)};el.appendChild(c);
 });
}

function renderHead(){$('money').textContent=fmt(S.money);$('ptap').textContent=fmt(S.perTap);$('psec').textContent=fmt(getPS())}
function render(){renderHead();renderScene();renderTap();renderBiz();save()}
function save(){S.lastTime=Date.now();localStorage.setItem('tapGame',JSON.stringify(S))}
function buyTap(){if(S.money<S.tapCost)return;S.money-=S.tapCost;S.tapLevel++;S.perTap++;S.tapCost=Math.floor(S.tapCost*1.6);tg?.HapticFeedback?.impactOccurred('medium');render()}
function buyBiz(id){const b=S.businesses.find(x=>x.id===id);if(!b||S.money<b.cost)return;
 S.money-=b.cost;b.level++;b.income=b.baseIncome*Math.pow(1.15,b.level-1);b.cost=Math.floor(b.baseCost*Math.pow(1.18,b.level));
 tg?.HapticFeedback?.impactOccurred('medium');render()}

// === КОНТЕНТ ПАНЕЛИ ===
const content=$('content');
let collapsed=false;

// === ВКЛАДКИ (открывают контент, если он свёрнут) ===
document.querySelectorAll('.tab').forEach(t=>{
 t.addEventListener('click',e=>{
  e.stopPropagation();
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(x=>x.classList.add('hidden'));
  t.classList.add('active');
  $('tab-'+t.dataset.tab).classList.remove('hidden');
  // РАСКРЫВАЕМ контент при нажатии на вкладку
  if(collapsed){
   collapsed=false;
   content.classList.remove('collapsed');
   content.style.transform='';
  }
  tg?.HapticFeedback?.selectionChanged?.();
 });
});

// === СВАЙП ВНИЗ (только закрытие) ===
const handleArea=$('handleArea');
let startY=0,curY=0,dragging=false,moved=false;

function onStart(e){
  const t=e.touches?e.touches[0]:e;
  startY=t.clientY;curY=startY;
  dragging=true;moved=false;
  content.style.transition='none';
}
function onMove(e){
  if(!dragging)return;
  const t=e.touches?e.touches[0]:e;
  curY=t.clientY;
  const dy=curY-startY;
  if(Math.abs(dy)>5) moved=true;
  // Разрешаем тянуть ТОЛЬКО вниз (dy > 0) и только когда открыто
  if(collapsed){
    // Если уже свёрнуто — не двигаем
    return;
  }
  const max=window.innerHeight*0.44-30;
  const offset=Math.max(0,Math.min(max,dy)); // только вниз
  content.style.transform=`translateY(${offset}px)`;
  if(e.cancelable) e.preventDefault();
}
function onEnd(){
  if(!dragging)return;
  dragging=false;
  content.style.transition='';
  const dy=curY-startY;
  const threshold=30;
  // Только закрытие, если потянул вниз достаточно
  if(!collapsed&&dy>threshold){
    collapsed=true;
    content.classList.add('collapsed');
    content.style.transform='';
    tg?.HapticFeedback?.impactOccurred('soft');
  } else {
    content.style.transform='';
  }
  setTimeout(()=>{moved=false},50);
}

handleArea.addEventListener('touchstart',onStart,{passive:true});
handleArea.addEventListener('touchmove',onMove,{passive:false});
handleArea.addEventListener('touchend',onEnd);
handleArea.addEventListener('touchcancel',onEnd);
handleArea.addEventListener('mousedown',onStart);
window.addEventListener('mousemove',e=>{if(dragging)onMove(e)});
window.addEventListener('mouseup',()=>{if(dragging)onEnd()});

// === ТАП ПО ЭКРАНУ ===
$('tapZone').addEventListener('pointerdown',e=>{
 S.money+=S.perTap;
 tg?.HapticFeedback?.impactOccurred('light');
 const f=document.createElement('div');
 f.className='float';f.textContent='+'+fmt(S.perTap);
 f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';
 document.body.appendChild(f);setTimeout(()=>f.remove(),1000);
 const r=document.createElement('div');
 r.className='tap-ring';
 r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';
 document.body.appendChild(r);setTimeout(()=>r.remove(),600);
 renderHead();renderScene();save();
});

let lt=Date.now();
setInterval(()=>{const t=Date.now(),dt=(t-lt)/1000;lt=t;
 const inc=getPS()*dt;if(inc>0){S.money+=inc;renderHead();renderScene()}S.lastTime=t},100);
setInterval(save,5000);
window.addEventListener('beforeunload',save);
render();
if(offEarn>0.5)setTimeout(()=>toast('💰 Оффлайн-доход: +'+fmt(offEarn)),600);
</script>
</body>
    </html>
